  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Antes de pedir
    preguntas:
      - { pregunta: "¿Hasta dónde repartís?", respuesta: "Por el centro de Alicante: Centro y Casco Antiguo, Benalúa, Ensanche Diputación, Mercado Central, Raval Roig, San Blas y Carolinas. Si tu calle no aparece, llámanos y te decimos." }
      - { pregunta: "¿Cuánto tarda un pedido?", respuesta: "Para recoger, unos 15 minutos. A domicilio, entre 30 y 40 minutos; los viernes y sábados por la noche puede ser algo más." }
      - { pregunta: "¿Tenéis pizzas sin gluten?", respuesta: "Sí. Tenemos masa sin gluten y la horneamos en una bandeja aparte, pero en la cocina se trabaja con harina de trigo: si eres celíaco, avísanos al pedir." }
      - { pregunta: "¿Se puede pagar con tarjeta al repartidor?", respuesta: "Sí. Nuestros repartidores llevan datáfono, y también puedes pagar en efectivo o por Bizum al recoger." }
      - { pregunta: "¿Hacéis pedidos grandes para fiestas o empresas?", respuesta: "Sí. Para más de ocho pizzas, mejor encárgalo con un día de antelación por teléfono o por el formulario de contacto." }

  contacto:
