      - { titulo: Horno de leña, texto: "A más de 400 grados: la pizza sale en menos de dos minutos." }
      - { titulo: Producto de aquí, texto: "Tomate de la huerta de Mutxamel y verdura del Mercado Central." }
    galeria:
      - /fotos/masa.jpg
      - /fotos/ingredientes.jpg
      - /fotos/caja.jpg
      - /fotos/local.jpg

  zonas:
