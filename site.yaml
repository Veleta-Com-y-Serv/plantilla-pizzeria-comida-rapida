  sobre:
    activa: true
    antetitulo: La masa
    titulo: 48 horas de reposo y 90 segundos de horno
    declaracion: "Harina italiana, agua, sal, masa madre y tiempo. Nada más."
    texto: |
      Abrimos La Pala en 2019 en la calle San Fernando, a dos pasos de la Explanada, con un horno de leña traído de Nápoles y una idea fija: hacer la pizza que nos gusta comer.

      La masa reposa dos días en cámara antes de estirarla a mano. Sale ligera, con el borde hinchado y tostado. El tomate, la verdura y el queso de cabra los compramos en la huerta y en los mercados de la provincia.
    imagen: /fotos/sobre.jpg
    items:
