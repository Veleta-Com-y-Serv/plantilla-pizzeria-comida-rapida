    testimonios:
      - { texto: "La mejor masa que he probado en Alicante. Ligera, con el borde tostado, y llegó a casa todavía caliente.", autor: Lucía P., nota: Google }
      - { texto: "Pedimos la de gamba roja por curiosidad y ya es fija cada viernes. La smash doble, también un diez.", autor: Andrés V., nota: Google }
